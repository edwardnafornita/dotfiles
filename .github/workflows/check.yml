name: Configuration checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Immutable action revisions; review updates like any other dependency.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate desktops, validate compositor configs, test installer and updater
        run: nix flake check path:. --no-update-lock-file --print-build-logs
      - name: Verify host selection with path and Git sources
        run: bash tests/host-selection.sh
      - name: Check formatting (leave generated hardware untouched)
        shell: bash
        run: |
          mapfile -d '' files < <(find . -name '*.nix' -not -path './.git/*' -not -name hardware-configuration.nix -print0)
          nix run path:.#formatter.x86_64-linux -- --check "${files[@]}"
